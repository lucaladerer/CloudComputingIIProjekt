<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, no-cache">
    <title>Joke-Ranking</title>

    <!-- Boostrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>

    <!-- Own stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Header -->
  <div class="container-fluid">
    <header class="d-flex sticky-top justify-content-center py-3">
      <ul class="nav nav-pills">
        <li class="nav-item"><a href="{{ url_for('index') }}" class="nav-link active" aria-current="page">Home</a></li>
        <li class="nav-item"><a href="{{ url_for('ranking') }}" class="nav-link text-secondary">Ranking</a></li>
      </ul>
    </header>
  </div>

  <!-- Load Button -->
  <div class="container-fluid" style="text-align: center; margin-top: 50px;">
    <h1>Rate a new joke!</h1>
    <button id="loadJoke" type="button" class="btn btn-outline-primary">Load a new joke</button>
  </div>

  <!-- Rating section -->
  <div class="container-fluid" style="text-align: center; margin-top: 50px;">
    <h1 id="jokeSetup" class="display-4" style="margin: 50px;"></h1>
    <h1 id="jokePunchline" class="display-4" style="margin: 50px;"></h1>
    <div class="container my-4">
      
      <div id="starRating" class="d-flex justify-content-center">
        <i class="bi bi-star star" data-value="1"></i>
        <i class="bi bi-star star" data-value="2"></i>
        <i class="bi bi-star star" data-value="3"></i>
        <i class="bi bi-star star" data-value="4"></i>
        <i class="bi bi-star star" data-value="5"></i>
      </div>

      <p id="ratingDisplay" class="mt-3">Chosen stars: 0</p>
      <button id="submitJokeRanking" type="submit" class="btn btn-outline-success">Submit</button>
    </div>
  </div>

  <!-- Own script -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
<footer></footer>
</html>
