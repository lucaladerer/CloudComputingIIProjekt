    #     path: /etc/environment
    #     line: 'DB_PASSWORD="VfnMplqnE7iQJemc"'
    #     create: yes
    #     state: present


    - name: Adding user to docker group  
      user: name=azureuser
            groups=docker
            append=yes

    - name: Starte Docker Container mit Flask-App
      community.docker.docker_container:
        name: web_app
        image: lucaladerer/web_app:latest
        pull: 1
        state: started
        ports:
          - "5000:5000"
        env:
          DB_PASSWORD: "VfnMplqnE7iQJemc"

    - name: Installiere pymongo via pip
      ansible.builtin.pip:
        name: pymongo
        state: present



