    - name: Konfiguriere uneingeschränkten Zugriff (Whitelist 0.0.0.0/0) in Atlas
      vars:
        atlas_project_id: "67cb5fc228b465316458be99"       # Bitte anpassen
        atlas_provider: "AZURE"                     # Oder "AWS", "GCP" etc.
        atlas_region: "westeurope"                  # Region, in der der Cluster erstellt werden soll
        atlas_instance_size: "M10"                  # Beispiel: M10
        atlas_disk_size: 10                         # in GB
        atlas_public_key: "rcncprnf"         # Bitte anpassen
        atlas_private_key: "f0af8edb-897d-4985-ac86-e7b94a125f99"    
      delegate_to: rh01
      uri:
        url: "https://cloud.mongodb.com/api/atlas/v1.0/groups/{{ atlas_project_id }}/accessList"
        method: POST
        user: "{{ atlas_public_key }}"
        password: "{{ atlas_private_key }}"
        force_basic_auth: no
        headers:
          Content-Type: "application/json"
        body_format: json
        body: >
          [
            {
              "ipAddress": "0.0.0.0/0",
              "comment": "Allow all access"
            }
          ]
        status_code: 201


