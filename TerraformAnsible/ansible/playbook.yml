---
- name: playbook
  hosts: rh01
  become: yes
  tasks:
    - name: DB_PASSWORD setzen
      ansible.builtin.shell: echo "DB_PASSWORD ist $DB_PASSWORD"
      environment:
        DB_PASSWORD: "mein_geheimes_passwort"


    - name: Aktualisiere die Paketliste
      ansible.builtin.apt:
        update_cache: yes

    - name: Installiere Python3
      ansible.builtin.apt:
        name: python3
        state: present

    - name: Installiere python3-pip
      ansible.builtin.apt:
        name: python3-pip
        state: present

    - name: Installiere das Docker Python SDK
      ansible.builtin.pip:
        name: docker
        executable: pip3
        state: present

    - name: Docker installieren
      ansible.builtin.apt:
        name: docker.io
        state: present

    # - name: Docker Service starten und aktivieren
    #   ansible.builtin.systemd:
    #     name: docker
    #     state: started
    #     enabled: yes

    # - name: /etc/environment --> MongoDB password
    #   lineinfile:

    #     path: "/etc/environment"
    #     state: present
