- name: Install and configure required packages + docker + set environment 
  hosts: rh01
  become: yes
  vars_files:
    - secrets.yml
  tasks:
    # - name: Set env variable DB_PASSWORD
    #   ansible.builtin.shell: echo "Set DB_PASSWORD"
    #   environment:
    #     DB_PASSWORD: "{{ DB_PASSWORD }}
    - name: Update package list
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Python3
      ansible.builtin.apt:
        name: python3
        state: present

    - name: Install python3-pip
      ansible.builtin.apt:
        name: python3-pip
        state: present

    - name: Install Docker Python SDK
      ansible.builtin.pip:
        name: docker
        executable: pip3
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Add user to docker group
      ansible.builtin.user:
        name: azureuser
        groups: docker
        append: yes

    - name: Install pymongo via pip
      ansible.builtin.pip:
        name: pymongo
        state: present